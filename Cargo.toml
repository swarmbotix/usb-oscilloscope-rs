[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
usbscope-proto = { path = "crates/usbscope-proto" }
usbscope-usb = { path = "crates/usbscope-usb" }
thiserror = { version = "2", default-features = false }
log = "0.4"
nusb = "0.2.9"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
